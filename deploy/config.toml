# blackbox daemon configuration
# Defaults match the production service behavior.
# Place this file at ~/.config/blackbox/config.toml
# Or set BLACKBOX_CONFIG to point to a different path.

[daemon]
port = 7264
bind = "127.0.0.1"
mcp_name = "blackbox"
mcp_session_keepalive_secs = 21600
shutdown_grace_secs = 15
task_ttl_ms = 86400000
poller_min_interval_secs = 5

[index]
reindex_interval_secs = 120
edge_index_boot_rebuild = false

[provenance]
git_notes_namespace = "bb"

[lsp]
idle_timeout_secs = 600
request_timeout_secs = 30
jdtls_init_timeout_secs = 60
rust_analyzer_init_timeout_secs = 60

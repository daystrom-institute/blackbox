# Nextest profiles for the blackbox workspace (build-cycle lever, thread-9938dffd).
#
#   default — mid-cycle gate: `cargo nextest run --workspace`
#             (~24s: 3,700 tests across all crates/targets, minus the
#             quarantined slow pair). ALWAYS pass --workspace: the root
#             manifest is workspace+package, so a bare `cargo nextest run`
#             silently covers the root package only and drops the ~1,800
#             tests living in peeled crates (bbox-refactor alone holds 854).
#   full    — fold-time gate: `cargo nextest run --workspace --profile full`
#             (entire suite, quarantined tests included; wall-clock is
#             pinned by the ~68s extended catalog migration fault matrix).
#
# Quarantined tests (each >45s of single-test wall-clock; together they pin
# the suite's critical path):
#   - lsp_rename_cell::cell_renames_cross_file_via_lsp_authority (~30s: cold
#     rust-analyzer index inside a V8 cell; bro-harness integration)
#   - project_catalog_store::tests::migration_extended_fault_matrix_covers_pointer_and_both_asset_modes
#     (~68s alone on a warm Mac after the catalog IO stopped flushing under
#     fault injection; previously 84-124s, with a 120s HARD-KILL TIMEOUT
#     observed in full-workspace runs)
#   - project_catalog_store::tests::migration_active_source_fault_matrix_preserves_typed_source_state
#     (~50s alone; previously 60-71s)
#
# The two fault matrices rebuild a fixture and run a migration plus recovery
# once per injected checkpoint. Their remaining cost is file opens, content
# hashing (software SHA-256 on aarch64 with the current sha2 crate) and the
# durable writes of stores other than the catalog IO. Alone they pass; under
# full-workspace CPU contention with each other and the ~20-40s unquarantined
# siblings the extended one has crossed the default profile's 120s kill as a
# load-dependent flake, not a hang and not a break. Both still run under
# --profile full, which the cluster verify and the fold gate use.
#
# Formerly quarantined and now ordinary (each under 6s):
#   - registered_project_markdown_and_rust_source_are_searchable indexed the
#     live checkout with its whole Git history (~250s on a warm Mac); it now
#     indexes a synthetic fixture, and the live-checkout variant is an
#     #[ignore]d opt-in benchmark.
#   - compact_caps_at_ten_thousand_keeping_newest appended 10,005 events
#     through the durable path (one full disk flush each); it now lays the
#     journal down directly.
#
# Nextest runs each test in its own process. Env-mutating tests guarded by
# crate::util::test_env_lock() stay correct here — per-process env isolation
# supersedes the in-process mutex; the lock remains required for plain
# `cargo test`, which still shares one process.

[profile.default]
default-filter = """
not (
  test(=cell_renames_cross_file_via_lsp_authority)
  | test(=project_catalog_store::tests::migration_extended_fault_matrix_covers_pointer_and_both_asset_modes)
  | test(=project_catalog_store::tests::migration_active_source_fault_matrix_preserves_typed_source_state)
)
"""
# Name slow tests instead of silently clipping: flag at 30s, hard-kill at 2min.
slow-timeout = { period = "30s", terminate-after = 4 }
final-status-level = "slow"

# Retry native aborts instead of failing the gate on them: Linux CI runs
# (fresh clone, full-workspace relink, then immediate 4,300-test run) have
# shown rare first-execution SIGBUS aborts in bbox-refactor's tree-sitter
# tests (random victim, never reproducible on re-run, never seen on warm
# binaries). Retries keep the gate honest — nextest reports the test as
# FLAKY rather than silently green — while a real deterministic failure
# still fails all three attempts. Scoped to the one crate observed.
[[profile.default.overrides]]
filter = 'package(bbox-refactor)'
retries = 2

[profile.full]
default-filter = "all()"
# The quarantined tests legitimately run 50-80s; flag at 60s, kill at 5min.
slow-timeout = { period = "60s", terminate-after = 5 }
final-status-level = "slow"

[workspace]
# The root `blackbox` package is implicitly a member; these are the
# bro-harness crates. The contract-bottom crates are dependency-only schema/
# trait crates; implementation crates point down at them, never sideways.
members = [
    "crates/bro-core",
    "crates/bro-protocol",
    "crates/bro-capabilities",
    "crates/bro-tools",
    "crates/bro-harness",
    "crates/bro-lsp",
    "crates/bro-cli",
    "crates/bro-fleet-client",
    "crates/bro-transcript",
    "crates/bro-code-mode",
    "crates/bro-apply-patch",
    "crates/bro-slack",

    # Daemon-internal corpus crates peeled out of the root `blackbox` crate for
    # build parallelism (NOT bro-harness crates). Pure leaves: they depend only
    # on external crates, never on blackbox internals, and are re-exported back
    # into the daemon under their original module path.
    "crates/bbox-vectors",
    "crates/bbox-corpus-core",
    "crates/bbox-corpus-index",
    "crates/bbox-edge-sidecar",
    "crates/bbox-chunker",
    "crates/bbox-lsp",
    "crates/bbox-refactor",
    "crates/bbox-packets",
    "crates/bbox-system-memory",
    "crates/bbox-whiteboards",
    "crates/bbox-util",
    "crates/bbox-stores",
    "crates/bbox-config",
    "crates/bbox-artifacts",
    "crates/bbox-knowledge",
    "crates/bbox-threads",
    "crates/bbox-gaps",
    "crates/bbox-inbox",
    "crates/bbox-slack",
    "crates/bbox-edge-index",
    "crates/bbox-tool-docs",
    "crates/bbox-system-events",
    "crates/bbox-indexing",
    "crates/bbox-providers",
    "crates/bbox-embed",
    "crates/bbox-mcp-tools",
    "crates/bbox-visual-store",
]

[package]
name = "blackbox"
version = "0.0.1"
edition = "2024"
build = "build.rs"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tokio_unstable)'] }

[[bin]]
name = "blackboxd"
path = "src/main.rs"

# `bro` now lives in its own crate (crates/bro-cli) — §7 thin-client extraction.

[dependencies]
# Search index
tantivy = "0.22"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
schemars = "0.8"
clap = { version = "4.5", features = ["derive"] }

# Filesystem
walkdir = "2"
dirs = "6"
fs2 = "0.4"

# Error handling
anyhow = "1"
# Daemon-internal corpus crate (HNSW vector store) extracted from src/vectors.
bbox-vectors = { path = "crates/bbox-vectors" }
# Foundation crate (entity_ref + git) extracted from the root crate (stage 0).
bbox-corpus-core = { path = "crates/bbox-corpus-core" }
bbox-corpus-index = { path = "crates/bbox-corpus-index" }
bbox-edge-sidecar = { path = "crates/bbox-edge-sidecar" }
# Chunking + tree-sitter symbol extraction, extracted from the root crate (stage 1).
bbox-chunker = { path = "crates/bbox-chunker" }
bbox-packets = { path = "crates/bbox-packets" }
bbox-system-memory = { path = "crates/bbox-system-memory" }
bro-core = { path = "crates/bro-core" }
bro-protocol = { path = "crates/bro-protocol" }
bro-capabilities = { path = "crates/bro-capabilities" }
bro-transcript = { path = "crates/bro-transcript" }
bro-harness = { path = "crates/bro-harness" }
bro-fleet-client = { path = "crates/bro-fleet-client" }
# Direct dep for the in-process session's child-process env scrub
# (bro_tools::with_spawn_scrub); shell tools live here.
bro-tools = { path = "crates/bro-tools" }

# Fast non-poisoning locks
parking_lot = "0.12"

# Enum ↔ string derives (FromStr, Display, AsRefStr) — replaces
# hand-rolled from_str/as_str match blocks.
strum = { version = "0.26", features = ["derive"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# Time
chrono = "0.4"

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-metrics = "0.5"
async-trait = "0.1"

# MCP SDK
rmcp = { version = "1.4", features = [
    "server",
    "macros",
    "transport-streamable-http-server",
    # Client-side: needed by the workflow `mcp_call` op which dials
    # remote MCP servers (biofilter via stdio child-process; blackbox-
    # self via streamable HTTP) to inject deterministic tool results
    # into the arc context.
    "client",
    "transport-child-process",
    "transport-streamable-http-client-reqwest",
    # Use no-provider variant so rmcp's reqwest dep doesn't activate
    # aws-lc-rs via reqwest 0.13's default "rustls" feature; the ring
    # provider is installed at startup via the workspace rustls dep.
    "reqwest-tls-no-provider",
] }
tokio-util = { version = "0.7", features = ["rt"] }

# HTTP server (for /tail endpoint outside MCP)
axum = { version = "0.8", features = ["macros"] }
http = "1"

# IDs
uuid = { version = "1", features = ["v4"] }

# CLI HTTP client
reqwest = { version = "0.12", features = ["stream", "rustls-tls", "json"], default-features = false }
futures = "0.3"

# SSE stream construction
async-stream = "0.3"

rustls = { version = "0.23", default-features = false, features = ["ring"] }

# Process management (SIGTERM)
libc = "0.2"

# Webhook signature verification (HMAC-SHA256, regex matching for
# packet predicates).
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
regex = "1"

# Configuration loading
figment = { version = "0.10", features = ["toml", "env"] }

# File watching
notify = "8"
notify-debouncer-full = "0.6"

# Cron schedule parsing for the cron-inlet primitive (calendar-driven
# tick → routing packet → arc dispatch).
cron = "0.16"
jsonschema = { version = "0.17", default-features = false, features = ["draft202012"] }

# Atomic-rename writes — used by both production code (refactor.rs's
# write_atomic) and tests. Production usage requires this be a real
# dependency, not dev-only.
tempfile = "3"
bbox-whiteboards = { path = "crates/bbox-whiteboards" }
bbox-util = { path = "crates/bbox-util" }
bbox-stores = { path = "crates/bbox-stores" }
bbox-config = { path = "crates/bbox-config" }
bbox-artifacts = { path = "crates/bbox-artifacts" }
bbox-knowledge = { path = "crates/bbox-knowledge" }
bbox-threads = { path = "crates/bbox-threads" }
bbox-gaps = { path = "crates/bbox-gaps" }
bbox-inbox = { path = "crates/bbox-inbox" }
bbox-slack = { path = "crates/bbox-slack" }
bbox-edge-index = { path = "crates/bbox-edge-index" }
bbox-tool-docs = { path = "crates/bbox-tool-docs" }
bbox-system-events = { path = "crates/bbox-system-events" }
bbox-indexing = { path = "crates/bbox-indexing" }
bbox-providers = { path = "crates/bbox-providers" }
bbox-embed = { path = "crates/bbox-embed" }
bbox-mcp-tools = { path = "crates/bbox-mcp-tools" }
# Visual payload sidecar (Layer 4 visual chunk backfill decode): the
# daemon-side reembed path decodes VisualPayloadRef off stored chunks.
bbox-visual-store = { path = "crates/bbox-visual-store" }

[dev-dependencies]
filetime = "0.2"
# Enable bbox-vectors' test-global-store helpers for the daemon's own tests.
# cfg(test) doesn't cross crate boundaries, so this dev-dep turns on the
# `test-support` feature only when building blackbox's tests (off in release).
bbox-vectors = { path = "crates/bbox-vectors", features = ["test-support"] }
# Same pattern for bbox-embed's install_test_router: tests that pin a
# per-test vector store must pin route derivation too, or partition ids
# drift with the host's real embed.toml.
bbox-embed = { path = "crates/bbox-embed", features = ["test-support"] }
# Same pattern for bbox-visual-store's install_test_global: visual-chunk
# tests must pin the payload store to a tempdir, never the real state dir.
bbox-visual-store = { path = "crates/bbox-visual-store", features = ["test-support"] }
# ServiceExt::oneshot for exercising axum route tables in tests.
tower = { version = "0.5", features = ["util"] }

[profile.release]
opt-level = 3
# LTO disabled: this daemon is I/O-bound (tantivy search, HTTP, subprocess
# orchestration), so thin-LTO's whole-program reopt pass costs build minutes for
# marginal runtime benefit. Re-enable lto="thin" if a profile shows a hot path
# that benefits from cross-crate inlining.
lto = false
# In-process session isolation prerequisite (harness-daemon-boundary.md §5):
# the daemon runs API-native sessions as tokio tasks, and a logic panic in one
# session's turn must be caught at the task boundary so the daemon and sibling
# sessions survive. That requires unwinding panics (not abort) AND non-poisoning
# locks on shared corpus/atom state — the latter is satisfied by parking_lot
# (see src/server/state.rs). `unwind` is the toolchain default, but it is
# load-bearing here, so it is pinned explicitly: do NOT switch this to "abort"
# without first relocating execution into a worker boundary (§12 corpus/execution
# split), or a single session panic will take down the whole daemon.
panic = "unwind"

[lib]
name = "blackbox"
path = "src/lib.rs"

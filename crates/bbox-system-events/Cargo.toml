[package]
name = "bbox-system-events"
version = "0.0.1"
edition = "2024"

# Extracted from the origin crate by extract_rust_crate; the origin aliases
# the moved modules back under their original `crate::<module>` paths.

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
bbox-corpus-core = { path = "../bbox-corpus-core" }
bbox-packets = { path = "../bbox-packets" }
parking_lot = "0.12"
tracing = "0.1"
chrono = "0.4"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
regex = "1"
tempfile = "3"
bbox-util = { path = "../bbox-util" }

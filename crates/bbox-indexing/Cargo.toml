[package]
name = "bbox-indexing"
version = "0.0.1"
edition = "2024"

# Extracted from the origin crate by extract_rust_crate; the origin aliases
# the moved modules back under their original `crate::<module>` paths.

[features]
# Exposes accepted-publication fixture installation to DOWNSTREAM crates'
# tests (see src/accepted_publication_test_support.rs). Off by default.
test-support = []

[dependencies]
tantivy = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "0.8"
anyhow = "1"
fs2 = "0.4"
bbox-corpus-core = { path = "../bbox-corpus-core" }
bbox-code-source = { path = "../bbox-code-source" }
bbox-code-source-store = { path = "../bbox-code-source-store" }
bbox-git-source-store = { path = "../bbox-git-source-store" }
bbox-corpus-index = { path = "../bbox-corpus-index" }
bbox-edge-sidecar = { path = "../bbox-edge-sidecar" }
bbox-artifacts = { path = "../bbox-artifacts" }
bbox-packets = { path = "../bbox-packets" }
bbox-provenance = { path = "../bbox-provenance" }
bbox-slack = { path = "../bbox-slack" }
bbox-whiteboards = { path = "../bbox-whiteboards" }
bro-core = { path = "../bro-core" }
bro-transcript = { path = "../bro-transcript" }
parking_lot = "0.12"
tracing = "0.1"
tokio = { version = "1", features = ["full"] }
rmcp = { version = "1.4", features = [
    "server",
    "macros",
    "transport-streamable-http-server",
    # Client-side: needed by the workflow `mcp_call` op which dials
    # remote MCP servers (biofilter via stdio child-process; blackbox-
    # self via streamable HTTP) to inject deterministic tool results
    # into the arc context.
    "client",
    "transport-child-process",
    "transport-streamable-http-client-reqwest",
    # Use no-provider variant so rmcp's reqwest dep doesn't activate
    # aws-lc-rs via reqwest 0.13's default "rustls" feature; the ring
    # provider is installed at startup via the workspace rustls dep.
    "reqwest-tls-no-provider",
] }
sha2 = "0.10"
hex = "0.4"
tempfile = "3"
libc = "0.2"
bbox-util = { path = "../bbox-util" }
bbox-stores = { path = "../bbox-stores" }
bbox-chunker = { path = "../bbox-chunker" }
bbox-gaps = { path = "../bbox-gaps" }
bbox-knowledge = { path = "../bbox-knowledge" }
bbox-config = { path = "../bbox-config" }
bbox-threads = { path = "../bbox-threads" }
bbox-edge-index = { path = "../bbox-edge-index" }
bbox-vectors = { path = "../bbox-vectors" }

[dev-dependencies]
bbox-git-source = { path = "../bbox-git-source" }
# Enable this crate's own `test-support` feature for its integration tests.
# `#[cfg(test)]` does not reach an integration test, and the section 13.8
# fixture set has to install accepted publications through the SAME
# single-owner helpers the daemon fixtures use rather than growing a second
# installer. Dev-only: no production build carries the feature.
bbox-indexing = { path = ".", features = ["test-support"] }

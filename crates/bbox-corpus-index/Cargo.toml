[package]
name = "bbox-corpus-index"
version = "0.0.1"
edition = "2024"

# Daemon-internal corpus crate, peeled out of the root `blackbox` crate
# (root-crate-peels arc). The transcript/code index ENGINE: tantivy schema +
# TranscriptIndex, search, transcript adapters and projection, project-file /
# git-history / tool-edge index passes, scan/meta utilities, and the
# daemon-hook seams (embed enqueue, manual store-doc pass). Store-agnostic by
# invariant: the store->doc builders, writer actor, and reindex orchestration
# stay daemon-side and call down into this crate; daemon-side wiring attaches
# only through the startup-injected hooks in `index::embed_hook`.

[dependencies]
anyhow = "1"
parking_lot = "0.12"
dirs = "6"
hex = "0.4"
ignore = "0.4"
libc = "0.2"
regex = "1"
schemars = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tantivy = "0.22"
tracing = "0.1"
walkdir = "2"

bbox-chunker = { path = "../bbox-chunker" }
bbox-code-source = { path = "../bbox-code-source" }
bbox-code-source-store = { path = "../bbox-code-source-store" }
# The conversation landing lane. Read-only from here: this crate projects
# landed records into transcript documents and never lands one.
bbox-transcript-source = { path = "../bbox-transcript-source" }
bbox-transcript-source-store = { path = "../bbox-transcript-source-store" }
bbox-conversation-source = { path = "../bbox-conversation-source" }
bbox-conversation-source-store = { path = "../bbox-conversation-source-store" }
bbox-corpus-core = { path = "../bbox-corpus-core" }
# Leaf-to-leaf: the graph kernel depends only on bbox-corpus-core. Needed so
# the query-time graph authority snapshot can carry the accepted generation
# the vector lane re-checks eligibility against (unified-retrieval 5.1).
bbox-project-graph = { path = "../bbox-project-graph" }
bbox-edge-sidecar = { path = "../bbox-edge-sidecar" }
bro-core = { path = "../bro-core" }
bro-transcript = { path = "../bro-transcript" }

[dev-dependencies]
tempfile = "3"

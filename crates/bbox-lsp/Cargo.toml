[package]
name = "bbox-lsp"
version = "0.0.1"
edition = "2024"

# Daemon-internal LSP helpers extracted from the root `blackbox` crate
# (stage 2 of the code-intelligence cluster split). Depends downward on
# bbox-corpus-core and external crates only, never on blackbox internals.

[dependencies]
anyhow = "1"
bbox-corpus-core = { path = "../bbox-corpus-core" }
lsp-types = "0.94.1"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
url = "2.5.8"

[dev-dependencies]
tempfile = "3"

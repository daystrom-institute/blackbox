# The per-machine fleet supervisor (slice 5 of
# design/daemon-runtime/locality-first-decomposition.md).
#
# DEPENDENCY CEILING, enforced by scripts/acceptance-fleetd-deps.sh: the whole
# point of extracting this binary is that it rarely changes and never restarts
# when the daemon does. It must not link `blackbox`, `bro-harness`,
# `bro-code-mode`, `bro-capabilities`, any `bbox-*` crate, tantivy, or V8.
# It talks to the contract bottom (bro-protocol) over the transport substrate
# (bro-rpc), verifies bounded worker-local workspace facts supplied by the
# daemon, and spawns processes. That is the entire job.
[package]
name = "fleetd"
version = "0.0.1"
edition = "2024"
build = "build.rs"

[[bin]]
name = "fleetd"
path = "src/main.rs"

[dependencies]
bro-core = { path = "../bro-core" }
bro-protocol = { path = "../bro-protocol" }
bro-rpc = { path = "../bro-rpc" }

anyhow = "1"
libc = "0.2"
# TLS for the TCP owner listener: a self-signed identity generated by
# `fleetd identity init`, served through rustls on the ring provider the rest
# of the workspace installs.
rcgen = { version = "0.13", default-features = false, features = ["crypto", "pem", "ring"] }
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = { version = "1", features = ["std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
serde_json = "1"
tokio = { version = "1", features = [
    "fs",
    "io-util",
    "macros",
    "net",
    "process",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
# Parity test only: the default state dir must equal the daemon's
# `bbox_util::util::bro_home_dir`. Dev edges are outside the dependency ceiling.
bbox-util = { path = "../bbox-util" }
serde_json = "1"
tempfile = "3"

[lints.clippy]
disallowed_methods = "deny"

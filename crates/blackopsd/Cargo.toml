[package]
name = "blackopsd"
version = "0.0.1"
edition = "2024"

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", features = ["macros"] }
blackops-core = { path = "../blackops-core" }
bro-capabilities = { path = "../bro-capabilities" }
bro-core = { path = "../bro-core" }
bro-protocol = { path = "../bro-protocol" }
bro-rpc = { path = "../bro-rpc" }
clap = { version = "4.5", features = ["derive", "env"] }
jsonschema = { version = "0.17", default-features = false, features = ["draft202012"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
walkdir = "2"

# OTel export (env-gated: OTEL_EXPORTER_OTLP_ENDPOINT unset keeps today's
# fmt-only subscriber; see src/telemetry.rs). blackopsd is a separate
# crate from blackboxd (no shared dependency), so this mirrors
# transcript-search/src/server/telemetry.rs's trace+log pipeline rather
# than importing it -- see that module's doc comment for the full
# disabled-vs-enabled contract this mirrors. Metrics export is left to
# blackboxd stage 1; blackopsd has no bbox.* domain instruments defined
# yet, so a metrics pipeline here would have nothing to export.
opentelemetry = "0.32.0"
opentelemetry_sdk = "0.32.1"
opentelemetry-otlp = { version = "0.32.0", features = ["grpc-tonic", "trace", "logs"] }
opentelemetry-semantic-conventions = "0.32.1"
tracing-opentelemetry = "0.33.0"
opentelemetry-appender-tracing = "0.32.0"
hostname = "0.4.2"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[package]
name = "blackbox-corpus-service"
version = "0.0.1"
edition = "2024"

[lib]
name = "blackbox_corpus_service"
path = "src/lib.rs"

[[bin]]
name = "blackbox-corpusd"
path = "src/main.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", features = ["macros"] }
bbox-corpus-index = { path = "../bbox-corpus-index" }
bro-capabilities = { path = "../bro-capabilities" }
bro-core = { path = "../bro-core" }
bro-protocol = { path = "../bro-protocol" }
bro-rpc = { path = "../bro-rpc" }
clap = { version = "4.5", features = ["derive", "env"] }
dirs = "6"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
tantivy = "0.22"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

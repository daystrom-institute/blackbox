# bro-script — §5b de-risking spike (harness-daemon-boundary.md §5b).
#
# Embeds V8 in-process via deno_core as the NARF script-execution container.
# This crate is the SPIKE home only: it proves daemon-safety (heap-bound OOM
# containment, runaway-loop kill, denied globals, panic boundary) and the
# !Send-isolate <-> async-Rust capability bridge in ISOLATION.
#
# INVARIANT: zero `blackbox` dependency. bro-script is a contract-bottom-adjacent
# runtime crate — it couples only to deno_core + tokio + serde + anyhow and a
# LOCAL stub trait shaped like bro-capabilities. It must never link the daemon.
[package]
name = "bro-script"
version = "0.0.1"
edition = "2021"

[dependencies]
# The pure contract-bottom capability crate (async-trait + bro-core, ZERO
# blackbox). bro-script consumes the exact-handle AtomCapability/
# RefactorCapability traits by injection; it must never link the daemon.
bro-capabilities = { path = "../bro-capabilities" }
bro-core = { path = "../bro-core" }
# Pinned exactly: V8 ABI + op2 macro surface churn fast; this dep will later
# land in blackboxd, so the version is a deliberate, reported choice.
deno_core = "=0.403.0"
# Op error type: deno_core ops must return an error implementing
# `deno_error::JsErrorClass`; `JsErrorBox` is the catch-all. Pinned to the
# version deno_core 0.403 itself depends on.
deno_error = "=0.7.1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
async-trait = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }
# Tests construct real capability inputs/outputs and impl the traits directly.
bro-capabilities = { path = "../bro-capabilities" }
bro-core = { path = "../bro-core" }
async-trait = "0.1"
serde_json = "1"

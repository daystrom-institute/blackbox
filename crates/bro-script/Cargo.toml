# bro-script — raw V8 NARF script runtime (harness-daemon-boundary.md §5b).
#
# Embeds V8 in-process as the NARF script-execution container. The runtime is
# Codex-code-mode shaped: raw V8 isolate, Blackbox-owned host-call ABI, live JS
# promises for ordinary async work, and explicit daemon-owned durable handles
# above this crate when needed.
#
# INVARIANT: zero `blackbox` dependency. bro-script is a contract-bottom-adjacent
# runtime crate. It must never link the daemon.
[package]
name = "bro-script"
version = "0.0.1"
edition = "2021"

[dependencies]
# The pure contract-bottom capability crate (async-trait + bro-core, ZERO
# blackbox). bro-script consumes the exact-handle AtomCapability/
# RefactorCapability traits by injection; it must never link the daemon.
bro-capabilities = { path = "../bro-capabilities" }
bro-core = { path = "../bro-core" }
# Pinned exactly: V8 ABI churns fast; this dep lands in blackboxd, so the
# version is a deliberate, reported choice.
v8 = "=149.2.0"
deno_core_icudata = "0.77.0"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"
jsonschema = { version = "0.17", default-features = false, features = ["draft202012"] }
anyhow = "1"
async-trait = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }
# Tests construct real capability inputs/outputs and impl the traits directly.
bro-capabilities = { path = "../bro-capabilities" }
bro-core = { path = "../bro-core" }
async-trait = "0.1"
serde_json = "1"

[package]
name = "bro-worktree"
version = "0.0.1"
edition = "2024"

[dependencies]
anyhow = "1"
chrono = "0.4"
fs2 = "0.4"
schemars = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt"] }

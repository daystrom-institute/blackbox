[package]
name = "bbox-util"
version = "0.0.1"
edition = "2024"

# Extracted from the origin crate by extract_rust_crate; the origin aliases
# the moved modules back under their original `crate::<module>` paths.

[dependencies]
dirs = "6"
anyhow = "1"
# The legacy-migration source lock (R33F2) uses the same non-blocking flock
# idiom as the daemon's instance lock.
fs2 = "0.4"
bbox-corpus-core = { path = "../bbox-corpus-core" }
tracing = "0.1"
tokio = { version = "1", features = ["full"] }
tempfile = "3"

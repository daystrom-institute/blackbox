[package]
name = "bbox-chunker"
version = "0.0.1"
edition = "2024"

# Code/text/markdown chunking + tree-sitter symbol extraction, extracted from
# the root `blackbox` crate (stage 1 of the code-intelligence cluster split,
# gap-fe4dd97f). Sits on the bbox-corpus-core foundation (EntityRef). The 10
# tree-sitter grammars stay dep'd in root too (refactor uses them directly until
# its own stage); they compile once regardless. Re-exported into the daemon as
# `crate::chunker` (see src/lib.rs).

[dependencies]
bbox-corpus-core = { path = "../bbox-corpus-core" }
# Content-hash-addressed sidecar store for visual payload bytes (X-IMG
# chunker writes into it; design/corpus/agentic-corpus/
# multimodal-embedding-routing.md "Multimodal Chunk Model").
bbox-visual-store = { path = "../bbox-visual-store" }
anyhow = "1"
# Text-first PDF extraction for the X-PDF chunker (design/corpus/agentic-corpus/
# agentic-corpus-multimodal-chunkers.md). Pinned to the current published
# release (0.12.0, 2026-06-26) rather than a loose "0" range since it is a
# net-new dependency and the extraction API (extract_text_from_mem_by_pages)
# is worth pinning close to what was validated.
pdf-extract = "0.12"
# pdf_figure (design/corpus/agentic-corpus/agentic-corpus-multimodal-chunkers.md
# X-PDF section): extracts embedded raster XObjects for the visual payload
# sidecar. `pdf-extract` already depends on `lopdf` for its own parsing, and
# neither dependent needs lopdf's default features (chrono/jiff/rayon/time
# date-metadata helpers) or `embed_image` (pulls in the `image` crate; an
# XObject-*creation* helper this chunker never uses; only the page/XObject-
# *reading* API, `Document::get_page_images`, is used). `default-features =
# false` here confirmed via `git diff Cargo.lock` that this dependency adds
# NOTHING to the lockfile beyond this crate itself: lopdf was already
# resolved (transitively, via pdf-extract) and Cargo unifies to one shared
# build. Pinned to match the version pdf-extract 0.12 already resolves.
lopdf = { version = "0.42", default-features = false }
# FlateDecode raster payloads (uncompressed RGB/Gray only, no PNG predictor)
# are re-encoded into a minimal hand-built PNG; both crates are already
# transitively present (lopdf itself depends on flate2; crc32fast arrives via
# the zip/deflate stack below), so this is likewise zero new dependency tree.
flate2 = "1"
crc32fast = "1"
# Spreadsheet extraction for the X-XLSX chunker (design/corpus/agentic-corpus/
# agentic-corpus-multimodal-chunkers.md). Pinned to the current published
# release (0.36.0, 2026-07-06). `open_workbook_auto_from_rs` auto-detects
# xlsx/xlsm/xlam/xlsb/xls/ods from bytes, so this one dependency covers the
# whole family the chunker claims (crates/bbox-chunker/src/xlsx.rs).
calamine = "0.36"
# HTML parsing/traversal for the X-HTML chunker (design/corpus/agentic-corpus/
# agentic-corpus-multimodal-chunkers.md spec names `scraper` directly).
# `default-features = false` drops the `main` feature's `getopts` CLI-binary
# dependency, which this library-only usage never needs; `Html`/`Node`
# parsing and tree traversal work unchanged with it off. `ego-tree` is
# `scraper`'s own tree crate (unified by cargo to the same instance) and is
# depended on directly here only because `html.rs`'s iterative (non-recursive)
# tree walk needs to name the `NodeRef` type explicitly.
scraper = { version = "0.27.0", default-features = false }
ego-tree = "0.11"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
tracing = "0.1"
tree-sitter = "0.26"
tree-sitter-c = "0.24.2"
tree-sitter-c-sharp = "0.23.5"
tree-sitter-cpp = "0.23.4"
tree-sitter-go = "0.25.0"
tree-sitter-java = "0.23.5"
tree-sitter-javascript = "0.25.0"
tree-sitter-language-pack = "1.8.1"
quick-xml = "0.38"
# OOXML (.docx/.pptx) text extraction for the X-DOCX-PPTX chunker
# (design/corpus/agentic-corpus/agentic-corpus-multimodal-chunkers.md). Parsed
# directly (zip container + quick-xml tag-text extraction) rather than a
# docx-rs / pptx crate: those are thin, sparsely maintained wrappers over the
# same "unzip + read w:t/a:t runs" primitive needed here. `deflate` is the
# only enabled backend feature: OOXML parts are deflate- or store-compressed,
# never bzip2/lzma/zstd/AES. Version unified with the dev-dependency below.
zip = { version = "8.6", default-features = false, features = ["deflate"] }
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"

[dev-dependencies]
# Build a minimal .xlsx fixture byte-for-byte in the xlsx.rs test module
# (no checked-in binary fixture). Same major version calamine itself pins
# (0.36.0 -> zip ^8.6), so this doesn't pull in a second zip implementation.
tempfile = "3"
# ximg.rs tests pin the visual payload store to a tempdir rather than the
# real state dir; cfg(test) doesn't cross crate boundaries so this needs
# the feature turned on as a dev-dependency.
bbox-visual-store = { path = "../bbox-visual-store", features = ["test-support"] }

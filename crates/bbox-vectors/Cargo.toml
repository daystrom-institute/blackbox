[package]
name = "bbox-vectors"
version = "0.0.1"
edition = "2024"

# Extracted from the root `blackbox` crate (build-time decomposition: the
# 277k-LOC root crate is the release-build serial-frontend pole). Pure leaf —
# the HNSW vector store, WAL, and SIMD distance kernels depend only on external
# crates, no blackbox internals. Re-exported into the daemon as `crate::vectors`
# (see src/lib.rs). Tracked: gap-fe4dd97f (extract_rust_crate facility).

[dependencies]
anyhow = "1"
bincode = "1.3"
chrono = "0.4"
dirs = "6"
ordered-float = "5"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tracing = "0.1"
wide = "0.7"

[features]
# Exposes the test-global-store helpers (install_test_global / TestGlobalStoreGuard)
# to DOWNSTREAM crates' tests. `#[cfg(test)]` does not cross crate boundaries, so
# the daemon's test code (which installs an isolated in-memory store) enables this
# via a dev-dependency feature. Off by default → zero hot-path cost in production.
test-support = []

[dev-dependencies]
tempfile = "3"

[package]
name = "bbox-code-collector"
version = "0.0.1"
edition = "2024"

[[bin]]
name = "bbox-code-collector"
path = "src/main.rs"

[dependencies]
anyhow = "1"
bbox-code-source = { path = "../bbox-code-source" }
bbox-corpus-core = { path = "../bbox-corpus-core" }
bbox-git-source = { path = "../bbox-git-source" }
bbox-knowledge-source = { path = "../bbox-knowledge-source" }
bbox-provenance = { path = "../bbox-provenance", default-features = false, features = ["local-git"] }
bro-rpc = { path = "../bro-rpc" }
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
ignore = "0.4"
libc = "0.2"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3"

[dev-dependencies]
axum = "0.8"

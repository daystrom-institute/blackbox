    "bbox_project_eject",
    "bbox_project_catalog_*",
    "bbox_project_attach",
    "bbox_project_detach",
    "bbox_project_default_attachment",
    "bbox_project_promote",
    "bbox_project_publisher_*",
    "bbox_project_graph_*",
    "bbox_reindex",
    "bbox_reembed",
    "bbox_embed_*",
    "bbox_storage_*",
    "bbox_edge_compact",
    "bbox_doctor",
    "bbox_artifact_*",
    "bro_agent_*",
]

# Workflow-owned dispatches: no further dispatch, as a backstop to the
# mechanical recursion guard.
[surfaces.agent-internal]
disallow = [
    "bro_exec",
    "bro_resume",
    "bro_cancel",
    "bbox_stats",
    "bro_prune",
    "bro_allocator_*",
    "bro_mcp",
    "bbox_project_register",
    "bbox_project_init",
    "bbox_project_rename",
    "bbox_project_unregister",
    "bbox_project_eject",
    "bbox_project_catalog_*",

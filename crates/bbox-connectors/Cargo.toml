[package]
name = "bbox-connectors"
version = "0.0.1"
edition = "2024"

# Remote-source connectors: pluggable adapters onto remote file/document stores
# so drives, folders, and repos mount as registered, indexable blackbox projects.
# Materialize-then-index architecture (design/connectors/remote-source-connectors.md).

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
sha2 = "0.10"
hex = "0.4"
unicode-normalization = "0.1"
glob = "0.3"
bbox-corpus-core = { path = "../bbox-corpus-core" }
bbox-util = { path = "../bbox-util" }
bbox-stores = { path = "../bbox-stores" }

[dev-dependencies]
tempfile = "3"

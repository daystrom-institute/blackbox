# The `bro` terminal client (fleet cockpit, tail, council TUI).
#
# Stage 1 of the §7 thin-client extraction (harness-daemon-boundary.md §7): the
# `bro` binary is split out of the `blackbox` package into its own crate. It
# still depends on `blackbox` today — the boundary now makes that dependency
# surface explicit and measurable. Stage 2 cuts the `blackbox` dep by relocating
# the wire/view types (gated on the pervasive `Provider`) into the contract
# bottom so this links only `bro-protocol` + `bro-core`.
[package]
name = "bro-cli"
version = "0.0.1"
edition = "2024"

[[bin]]
name = "bro"
path = "src/main.rs"

[dependencies]
blackbox = { path = "../.." }
bro-fleet-client = { path = "../bro-fleet-client" }

clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
ratatui = { version = "0.29", features = ["unstable-rendered-line-info"] }
unicode-width = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
dirs = "6"
futures = "0.3"
futures-util = "0.3"
ratatui-core = "0.1"
reqwest = { version = "0.12", features = ["stream", "rustls-tls", "json"], default-features = false }
tracing = "0.1"
tui-markdown = "0.3"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"

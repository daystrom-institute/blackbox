# Headless daemon client. Shared configuration stays in bro-fleet-client.
[package]
name = "bro-cli"
version = "0.0.1"
edition = "2024"

[[bin]]
name = "bro"
path = "src/main.rs"

[dependencies]
bro-fleet-client = { path = "../bro-fleet-client" }
bbox-util = { path = "../bbox-util" }
# Restore conventional SIGPIPE behavior for piped output.
libc = "0.2"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
reqwest = { version = "0.12", features = ["stream", "rustls-tls", "json"], default-features = false }

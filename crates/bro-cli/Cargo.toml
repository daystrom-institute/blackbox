# The `bro` terminal client (fleet cockpit, tail, council TUI).
#
# §7 thin-client extraction COMPLETE (harness-daemon-boundary.md §7): the `bro`
# binary no longer depends on the `blackbox` daemon crate. It links the fleet
# engine (`bro-fleet-client`), the shared transcript parser (`bro-transcript`),
# and the contract bottom (`bro-protocol` + `bro-core`) transitively — never the
# daemon. The daemon is reached only over HTTP (`/control/*`, `/tail`, etc.).
[package]
name = "bro-cli"
version = "0.0.1"
edition = "2024"

[[bin]]
name = "bro"
path = "src/main.rs"

[dependencies]
bro-fleet-client = { path = "../bro-fleet-client" }
bro-transcript = { path = "../bro-transcript" }

clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
ratatui = { version = "0.29", features = ["unstable-rendered-line-info"] }
unicode-width = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
dirs = "6"
futures = "0.3"
futures-util = "0.3"
ratatui-core = "0.1"
reqwest = { version = "0.12", features = ["stream", "rustls-tls", "json"], default-features = false }
tracing = "0.1"
tui-markdown = "0.3"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"

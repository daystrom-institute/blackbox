[package]
name = "bbox-slack-collector"
version = "0.0.1"
edition = "2024"

[lib]
name = "bbox_slack_collector"
path = "src/lib.rs"

# The conversation satellite binary. It runs on the PRODUCER host beside the
# interactive bridge, holds the Slack bot credential, observes channel history
# and thread replies, and publishes records over the conversation-source wire.
# The library half stays independently testable: the closed read-method enum,
# the allowlist client, the enrollment policy, normalization, the reconciliation
# journal, and the publication cycle, which is written against a sink trait so
# its decisions are testable without a socket.
[[bin]]
name = "bbox-slack-collector"
path = "src/main.rs"

# THE DEPENDENCY CEILING IS THIS CRATE'S MOST VALUABLE PROPERTY, and here it
# carries a second job it does not carry on the file lane.
#
# Job one, shared with `bbox-file-collector`: this is a DUMB PRODUCER. It ships
# records, not documents. Chunking, Tantivy, embeddings, vectors, edges, and
# every other corpus behavior live on the corpus host, so exactly one chunker
# version exists in the system and a satellite deploy can never skew against
# the index.
#
# Job two, specific to the ruled one-app posture (design 3.1): the deployed
# credential is the interactive bot's own token, which carries write scopes this
# collector cannot refuse. Credential-level read-only enforcement is therefore
# unavailable, and write-safety is a property of the CODE PATH instead, in three
# layers. This file owns the third:
#
#   1. the crate contains no write call sites;
#   2. [`crate::slack::SlackReadMethod`] is a CLOSED enum of read methods and
#      the client cannot compose a request from anything else;
#   3. `scripts/acceptance-slack-collector-deps.sh` rejects corpus, harness, and
#      model-provider edges over the resolved graph.
#
# Note what is deliberately absent: any Slack SDK. A vendor SDK would bring a
# full method surface including `chat.postMessage`, and layer two would then be
# a convention rather than a construction. The client here is `reqwest` plus the
# closed enum, which is a few hundred lines and buys a property no audit of an
# SDK call site can.
[dependencies]
anyhow = "1"
async-trait = "0.1"
bbox-conversation-source = { path = "../bbox-conversation-source" }
bbox-corpus-core = { path = "../bbox-corpus-core" }
chrono = "0.4"
clap = { version = "4.5", features = ["derive"] }
globset = "0.4"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "signal", "time"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
axum = "0.8"
tempfile = "3"

[package]
name = "bro-tools"
version = "0.0.1"
edition = "2024"

# Provider-agnostic tool implementations + the Tool abstraction for the
# Anthropic harness. No Anthropic-specific code lives here; reusable by the
# daemon or a future in-process executor.

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "0.8"
async-trait = "0.1"
anyhow = "1"
chrono = "0.4"
tokio = { version = "1", features = ["process", "fs", "io-util", "rt", "macros", "time"] }
regex = "1"
reqwest = { version = "0.12", features = ["rustls-tls"], default-features = false }
ignore = "0.4"
globset = "0.4"
tracing = "0.1"
libc = "0.2"
fs2 = "0.4"
bro-apply-patch = { path = "../bro-apply-patch" }
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"

[lints.clippy]
# Phase 4 concurrency enforcement — see root clippy.toml (concurrency-model §5).
disallowed_methods = "deny"

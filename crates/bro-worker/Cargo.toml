[package]
name = "bro-worker"
version = "0.0.1"
edition = "2024"

[dependencies]
bro-core = { path = "../bro-core" }
bro-protocol = { path = "../bro-protocol" }
anyhow = "1"
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt", "sync", "time"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "test-util"] }

[lints.clippy]
disallowed_methods = "deny"

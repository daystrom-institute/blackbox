[package]
name = "bro-harness"
version = "0.0.1"
edition = "2024"

# The bro-harness headless coding agent. It can run as a daemon-spawned
# subprocess or, in later slices, as a linked library while preserving the same
# stdout stream envelope. See design/orchestration/anthropic-harness.md.

[[bin]]
name = "bro-harness"
path = "src/main.rs"

[[bin]]
name = "isolate"
path = "src/bin/isolate.rs"

[lib]
name = "bro_harness"
path = "src/lib.rs"

[dependencies]
bro-core = { path = "../bro-core" }
bro-protocol = { path = "../bro-protocol" }
bro-capabilities = { path = "../bro-capabilities" }
bro-code-mode = { path = "../bro-code-mode" }
bro-apply-patch = { path = "../bro-apply-patch" }
bro-tools = { path = "../bro-tools" }
tokio-util = { version = "0.7", features = ["rt"] }
bro-lsp = { path = "../bro-lsp" }
# Daemon-independent refactor substrate: backs the harness-native `code.*`
# fact bindings projected into code-mode cells (decision af3c4783 — refactor
# tooling is harness-native; the forbidden edge is only bro-harness -> blackbox).
bbox-refactor = { path = "../bbox-refactor" }
lsp-types = "0.94.1"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["stream", "rustls-tls", "json"], default-features = false }
http = "1"
futures-util = "0.3"
async-trait = "0.1"
# WebSocket Responses transport. rustls is a direct dep only to install the
# ring crypto provider (rustls 0.23 requires a process-default provider before
# a ClientConfig can be built); see openai_responses_ws.rs.
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
dirs = "6"
fs2 = "0.4"
base64 = "0.22"
chrono = "0.4"
iana-time-zone = "0.1"
rmcp = { version = "1.4", features = [
    "client",
    "transport-child-process",
    "transport-streamable-http-client-reqwest",
    # Use no-provider variant to avoid aws-lc-rs via reqwest 0.13's
    # default "rustls" feature; ring is installed by ensure_crypto_provider().
    "reqwest-tls-no-provider",
] }

[dev-dependencies]
tempfile = "3"

[lints.clippy]
# Phase 4 concurrency enforcement — see root clippy.toml (concurrency-model §5).
disallowed_methods = "deny"

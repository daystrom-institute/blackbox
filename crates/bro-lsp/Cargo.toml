[package]
name = "bro-lsp"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
dirs = "6"
lsp-types = "0.94.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = [
    "io-util",
    "macros",
    "process",
    "rt",
    "rt-multi-thread",
    "sync",
    "time",
] }

[dev-dependencies]
tempfile = "3"

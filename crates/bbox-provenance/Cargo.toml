[package]
name = "bbox-provenance"
version = "0.0.1"
edition = "2024"

[features]
default = ["local-git"]
local-git = []

[dependencies]
anyhow = "1"
bbox-corpus-core = { path = "../bbox-corpus-core" }
fs2 = "0.4"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
toml = "0.8"

[dev-dependencies]
tempfile = "3"

[package]
name = "bbox-refactor"
version = "0.0.1"
edition = "2024"

# Structural refactor planners/runners extracted from the root `blackbox` crate
# (stage 3 of the code-intelligence cluster split). Depends downward on
# bbox-corpus-core, bbox-chunker, bbox-lsp, and external crates only.

[dependencies]
bbox-corpus-core = { path = "../bbox-corpus-core" }
bbox-chunker = { path = "../bbox-chunker" }
bbox-lsp = { path = "../bbox-lsp" }
anyhow = "1"
dirs = "6"
hex = "0.4"
lsp-types = "0.94.1"
regex = "1"
reqwest = { version = "0.12", features = ["stream", "rustls-tls", "json"], default-features = false }
rmcp = { version = "1.4", features = ["server", "macros"] }
schemars = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
streaming-iterator = "0.1"
tempfile = "3"
toml = "0.8"
toml_edit = "0.22"
tracing = "0.1"
tree-sitter = "0.26"
tree-sitter-rust = "0.24.2"
walkdir = "2"

[package.metadata.cargo-machete]
# walkdir is used in rust_extract_trait.rs, rust_top_level_deps.rs,
# rust_public_api.rs, and java/rename_symbol.rs — machete false positive.
ignored = ["walkdir"]

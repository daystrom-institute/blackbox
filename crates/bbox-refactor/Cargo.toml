[package]
name = "bbox-refactor"
version = "0.0.1"
edition = "2024"

# Structural refactor planners/runners extracted from the root `blackbox` crate
# (stage 3 of the code-intelligence cluster split). Depends downward on
# bbox-corpus-core, bbox-chunker, bbox-lsp, and external crates only.

[dependencies]
bbox-corpus-core = { path = "../bbox-corpus-core" }
bbox-chunker = { path = "../bbox-chunker" }
bbox-lsp = { path = "../bbox-lsp" }
anyhow = "1"
chrono = "0.4"
dirs = "6"
hex = "0.4"
lsp-types = "0.94.1"
regex = "1"
reqwest = { version = "0.12", features = ["stream", "rustls-tls", "json"], default-features = false }
rmcp = { version = "1.4", features = ["server", "macros"] }
schemars = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
strum = { version = "0.26", features = ["derive"] }
tempfile = "3"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
toml_edit = "0.22"
tracing = "0.1"
tree-sitter = "0.26"
tree-sitter-c = "0.24.2"
tree-sitter-c-sharp = "0.23.5"
tree-sitter-cpp = "0.23.4"
tree-sitter-go = "0.25.0"
tree-sitter-java = "0.23.5"
tree-sitter-javascript = "0.25.0"
tree-sitter-language-pack = "1.8.1"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"
walkdir = "2"

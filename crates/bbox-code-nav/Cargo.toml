[package]
name = "bbox-code-nav"
version = "0.0.1"
edition = "2024"

# Syntax code navigation extracted from the root `blackbox` crate
# (stage 4 of the code-intelligence cluster split). Depends downward on
# bbox-corpus-core, bbox-chunker, bbox-lsp, bbox-refactor, and external crates only.

[dependencies]
bbox-corpus-core = { path = "../bbox-corpus-core" }
bbox-chunker = { path = "../bbox-chunker" }
bbox-lsp = { path = "../bbox-lsp" }
bbox-refactor = { path = "../bbox-refactor" }
anyhow = "1"
ignore = "0.4"
lsp-types = "0.94.1"
reqwest = { version = "0.12", features = ["stream", "rustls-tls", "json"], default-features = false }
rmcp = { version = "1.4", features = ["server", "macros"] }
schemars = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tracing = "0.1"
tree-sitter = "0.26"
url = "2"

[dev-dependencies]

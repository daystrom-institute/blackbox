[package]
name = "bro-rpc"
version = "0.0.1"
edition = "2024"

# The framing/auth/handshake transport substrate for same-host RPC channels
# (design/daemon-runtime/locality-first-decomposition.md slice 5: the
# daemon<->fleetd UDS channel). Mined from salvage/satellite-arc-20260718's
# crates/bro-rpc, generalized off the worker/fleet capability-RPC and
# lease/proof-rotation machinery that crate carried; see AGENTS.md.

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "time"] }
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[lints.clippy]
disallowed_methods = "deny"

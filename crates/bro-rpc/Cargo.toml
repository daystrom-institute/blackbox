[package]
name = "bro-rpc"
version = "0.0.1"
edition = "2024"

[dependencies]
bro-protocol = { path = "../bro-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
http = "1"
uuid = { version = "1", features = ["v4"] }
libc = "0.2"

[dev-dependencies]
bro-core = { path = "../bro-core" }
tempfile = "3"

[lints.clippy]
disallowed_methods = "deny"

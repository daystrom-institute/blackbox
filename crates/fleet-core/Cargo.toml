[package]
name = "fleet-core"
version = "0.0.1"
edition = "2024"

[dependencies]
bro-capabilities = { path = "../bro-capabilities" }
bro-core = { path = "../bro-core" }
bro-protocol = { path = "../bro-protocol" }
fs2 = "0.4"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"

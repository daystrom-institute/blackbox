[package]
name = "bbox-embed"
version = "0.0.1"
edition = "2024"

# Extracted from the origin crate by extract_rust_crate; the origin aliases
# the moved modules back under their original `crate::<module>` paths.

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
schemars = "0.8"
dirs = "6"
anyhow = "1"
bbox-vectors = { path = "../bbox-vectors" }
bbox-corpus-core = { path = "../bbox-corpus-core" }
bbox-chunker = { path = "../bbox-chunker" }
# Visual payload sidecar: EmbedRequest carries a VisualPayloadRef (not
# inline bytes); the queue worker loads bytes from this store at
# embed-request-build time (design/corpus/agentic-corpus/
# multimodal-embedding-routing.md "Multimodal Chunk Model").
bbox-visual-store = { path = "../bbox-visual-store" }
parking_lot = "0.12"
tracing = "0.1"
chrono = "0.4"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
rmcp = { version = "1.4", features = [
    "server",
    "macros",
    "transport-streamable-http-server",
    # Client-side: needed by the workflow `mcp_call` op which dials
    # remote MCP servers (biofilter via stdio child-process; blackbox-
    # self via streamable HTTP) to inject deterministic tool results
    # into the arc context.
    "client",
    "transport-child-process",
    "transport-streamable-http-client-reqwest",
    # Use no-provider variant so rmcp's reqwest dep doesn't activate
    # aws-lc-rs via reqwest 0.13's default "rustls" feature; the ring
    # provider is installed at startup via the workspace rustls dep.
    "reqwest-tls-no-provider",
] }
axum = { version = "0.8", features = ["macros"] }
reqwest = { version = "0.12", features = ["stream", "rustls-tls", "json"], default-features = false }
futures = "0.3"
sha2 = "0.10"
base64 = "0.22"
# Header-only image dimension sniffing for the multimodal payload guard
# (image pixel cap); no decode, no transitive deps.
imagesize = "0.13"
# Decode/resize/encode for visual payload normalization (gap-48ae5495):
# downscaling oversize images under the provider's pixel cap and padding
# thin scan-strip images into its aspect-ratio range, instead of
# poison-dropping them. default-features = false and only the codecs the
# normalizer actually touches: jpeg/png/gif/webp decode (the formats the
# chunkers can hand it) plus jpeg/png encode (the two output formats we
# ever re-encode to). Keeps out the heavier codecs (tiff, avif, openexr,
# dds, ...) the default feature set pulls in.
image = { version = "0.25", default-features = false, features = [
    "jpeg",
    "png",
    "gif",
    "webp",
] }
tempfile = "3"
bbox-stores = { path = "../bbox-stores" }
bbox-knowledge = { path = "../bbox-knowledge" }
bbox-threads = { path = "../bbox-threads" }
bbox-indexing = { path = "../bbox-indexing" }
bbox-project-graph = { path = "../bbox-project-graph" }

[features]
# Exposes install_test_router to DOWNSTREAM crates' tests (cfg(test) does
# not cross crate boundaries): tests that pair a per-test vector store
# with route derivation must pin the router instead of letting
# load_default() read the host's real embed.toml.
test-support = []

[dev-dependencies]
bbox-vectors = { path = "../bbox-vectors", features = ["test-support"] }
bbox-visual-store = { path = "../bbox-visual-store", features = ["test-support"] }
bbox-util = { path = "../bbox-util" }

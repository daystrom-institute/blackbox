[package]
name = "bbox-edge-index"
version = "0.0.1"
edition = "2024"

# Storage health, retention planning and garbage collection over the on-disk
# edge sidecar. No in-memory edge graph lives here.

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
bbox-corpus-core = { path = "../bbox-corpus-core" }
bbox-edge-sidecar = { path = "../bbox-edge-sidecar" }
bbox-chunker = { path = "../bbox-chunker" }
tempfile = "3"

[dev-dependencies]
filetime = "0.2"

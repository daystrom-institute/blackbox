[package]
name = "bro-capabilities"
version = "0.0.1"
edition = "2024"

[dependencies]
async-trait = "0.1"
base64 = "0.22"
bro-core = { path = "../bro-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "sync"] }

[package]
name = "bro-slack"
version = "0.0.1"
edition = "2024"

# Slack Socket Mode sidecar, extracted from the root crate's [[bin]] so it
# links against the peeled foundation crates (bbox-config / bbox-util)
# instead of the full blackbox lib — the binary builds in parallel with it.

[[bin]]
name = "bro-slack"
path = "src/main.rs"

[dependencies]
bbox-config = { path = "../bbox-config" }
bbox-util = { path = "../bbox-util" }
bro-rpc = { path = "../bro-rpc" }

anyhow = "1"
axum = { version = "0.8", features = ["macros"] }
chrono = "0.4"
clap = { version = "4.5", features = ["derive"] }
dirs = "6"
futures-util = "0.3"
hex = "0.4"
hmac = "0.12"
jsonschema = { version = "0.17", default-features = false, features = ["draft202012"] }
parking_lot = "0.12"
reqwest = { version = "0.12", features = ["stream", "rustls-tls", "json"], default-features = false }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

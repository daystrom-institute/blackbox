[package]
name = "bbox-git-source-store"
version = "0.0.1"
edition = "2024"

[dependencies]
anyhow = "1"
bbox-corpus-core = { path = "../bbox-corpus-core" }
bbox-git-source = { path = "../bbox-git-source" }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }

[features]
# Test-only finalize crash simulation for dependents' integration tests.
fault-injection = []

[dev-dependencies]
tempfile = "3"

[package]
name = "bbox-transcript-collector"
version = "0.0.1"
edition = "2024"

[dependencies]
anyhow = "1"
bbox-corpus-core = { path = "../bbox-corpus-core" }
bbox-transcript-source = { path = "../bbox-transcript-source" }
bro-rpc = { path = "../bro-rpc" }
clap = { version = "4.5", features = ["derive"] }
libc = "0.2"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
toml = "0.8"
walkdir = "2"

[dev-dependencies]
tempfile = "3"

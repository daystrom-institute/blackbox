[package]
name = "bro-protocol"
version = "0.0.1"
edition = "2024"

[dependencies]
bro-core = { path = "../bro-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The executor-side session log writer only (`session_log`); every wire DTO
# stays pure serde.
tokio = { version = "1", features = ["fs", "io-util"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt"] }

site_name: blackbox
site_description: "Single daemon for AI dev tooling: hybrid search, knowledge store, multi-provider agent orchestration"
repo_url: https://github.com/invidious9000/transcript-search
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.details
  - pymdownx.snippets
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - How It Works:
    - Operating Guide: operating-blackbox.md
    - Internals: internals.md
    - Graph And Retrieval Internals: graph-retrieval-internals.md
    - Index And Embedding Internals: index-embedding-internals.md
    - Operations: operations.md
  - Toolbelt:
    - Workflow Engine: workflows.md
    - Atoms: atoms.md
    - Rule Packets: rule-packets.md
    - Refactor Tools And Atoms: refactor.md
    - Bro Runtime: bro-runtime.md
    - Knowledge Store: knowledge-store.md
    - Transcript Retrieval: transcript-retrieval.md
    - Projects And Code Indexing: projects-code-indexing.md
    - Artifact Catalog: artifact-catalog.md
    - Agent System: agent-system.md
    - Badgey: badgey.md
    - Councils & Whiteboards: councils-whiteboards.md
    - MCP Surfaces: mcp-surfaces.md
    - Roadmap Tool: roadmap-tool.md
  - Integrations:
    - Ingress Paths: ingress-paths.md
    - Slack Bridge: slack-bridge.md
    - IRC Bridge: irc-bridge.md
  - Reference:
    - Examples: examples.md
    - Project Roadmap: roadmap.md

plugins:
  - search

# Forgejo single-instance for SASTquatch demo. Same shape as keystone's
# compose, different container name + volume so the two demos can run
# side by side without colliding.
#
# Closed-network assumption: lenient HMAC, plain HTTP, runs on
# 127.0.0.1 only. NOT production-shaped.
#
# Bring up:    docker compose -f docker-compose.yaml up -d
# Bootstrap:   ./scripts/bootstrap.sh
# Tear down:   docker compose down -v   (the -v wipes all data)

services:
  forgejo:
    image: codeberg.org/forgejo/forgejo:9
    container_name: sastquatch-forgejo
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - FORGEJO__database__DB_TYPE=sqlite3
      - FORGEJO__server__DOMAIN=localhost
      - FORGEJO__server__ROOT_URL=http://localhost:3100/
      - FORGEJO__server__HTTP_PORT=3000
      - FORGEJO__server__SSH_LISTEN_PORT=2222
      - FORGEJO__service__DISABLE_REGISTRATION=true
      - FORGEJO__security__INSTALL_LOCK=true
      - FORGEJO__security__SECRET_KEY=sastquatch-demo-not-for-production
      - FORGEJO__security__INTERNAL_TOKEN=sastquatch-demo-internal-token-not-for-production-1234567890
      - FORGEJO__webhook__ALLOWED_HOST_LIST=*
      - FORGEJO__webhook__SKIP_TLS_VERIFY=true
    restart: unless-stopped
    volumes:
      - sastquatch-forgejo-data:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      # Bind to loopback only — closed-network demo. Port 3100 host-
      # side so keystone's 3000 is free if both run.
      - "127.0.0.1:3100:3000"
      - "127.0.0.1:2223:22"

volumes:
  sastquatch-forgejo-data:

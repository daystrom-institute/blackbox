# Forgejo 15 single-instance for keystone-arc demo.
#
# Closed-network assumption: lenient HMAC, plain HTTP, runs on
# 127.0.0.1 only. NOT production-shaped.
#
# Bring up:    docker compose -f docker-compose.yaml up -d
# Bootstrap:   ./scripts/bootstrap.sh
# Tear down:   docker compose down -v   (the -v wipes all data)

services:
  forgejo:
    image: codeberg.org/forgejo/forgejo:15
    container_name: keystone-forgejo15
    environment:
      - USER_UID=1000
      - USER_GID=1000
      # Disable installation wizard — we configure via env.
      - FORGEJO__database__DB_TYPE=sqlite3
      - FORGEJO__server__DOMAIN=localhost
      - FORGEJO__server__ROOT_URL=http://localhost:3000/
      - FORGEJO__server__HTTP_PORT=3000
      - FORGEJO__server__SSH_LISTEN_PORT=2222
      - FORGEJO__service__DISABLE_REGISTRATION=true
      - FORGEJO__security__INSTALL_LOCK=true
      - FORGEJO__security__SECRET_KEY=keystone-demo-not-for-production
      - FORGEJO__security__INTERNAL_TOKEN=keystone-demo-internal-token-not-for-production-1234567890
      - FORGEJO__webhook__ALLOWED_HOST_LIST=*
      - FORGEJO__webhook__SKIP_TLS_VERIFY=true
    restart: unless-stopped
    volumes:
      - forgejo-data:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      # Bind to loopback only — closed-network demo.
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:2222:22"

volumes:
  forgejo-data:

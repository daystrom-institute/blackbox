# Slack app manifest template for bro-slack v1.
# Use this as a starting point; review and adjust before installing
# to api.slack.com/apps. This is NOT a turnkey manifest — the operator
# must fill in placeholder names, URLs, and decide which event
# subscriptions to enable.
#
# Install steps:
# 1. Go to https://api.slack.com/apps → Create New App → From manifest
# 2. Paste this manifest (after adjusting placeholders)
# 3. Under "Socket Mode", enable Socket Mode and generate an app-level
#    token (xapp-1-*) with connections:write scope
# 4. Under "Install App", install to your workspace; note the
#    Bot User OAuth Token (xoxb-*)
# 5. Under "Event Subscriptions", enable events you want delivered
#    over Socket Mode (app_mention, reaction_added, message.channels, etc.)
# 6. Add slash commands: /bbox, /explain
# 7. Add interactivity shortcuts if desired
# 8. Configure the scopes below, then reinstall the app

display_information:
  name: bbox-bot
  description: Blackbox orchestration assistant — triage, search, proposals via Slack
  background_color: "#1a1a2e"
  long_description: >
    Blackbox (bbox) is an orchestration agent that can triage issues,
    propose fixes, search your knowledge base, and coordinate multi-agent
    workflows. Mention @bbox or use /bbox commands to interact.

features:
  bot_user:
    display_name: bbox
    always_online: true
  slash_commands:
    - command: /bbox
      description: Ask bbox a question or run a command
      usage_hint: "[question | status | inbox | triage]"
      should_escape: false
    - command: /explain
      description: bbox explains a code artifact or past decision
      usage_hint: "<entity reference>"
      should_escape: false

oauth_config:
  scopes:
    bot:
      # ── v1 required scopes (§9.2) ──
      - app_mentions:read     # @bbox mentions in channels
      - chat:write            # post messages, threaded replies
      - commands              # slash command dispatch
      - reactions:read        # reaction events for approval signals
      - users:read            # resolve user IDs
      - channels:history      # receive message events (public channels)
      - groups:history        # receive message events (private channels)
      - im:history            # receive message events (DMs)
      # ── v1.5 additions (commented; uncomment when upgrading) ──
      # - users:read.email    # identity-claim modal
      # - chat:write.public   # post in channels bot isn't a member of
      # - groups:write        # create/manage private council channels
      # - chat:write.customize # per-persona display name/icon

settings:
  event_subscriptions:
    # Socket Mode handles delivery; no Request URL needed.
    # Enable the events you want delivered:
    #   - app_mention          (bot was @mentioned)
    #   - reaction_added       (reaction approval signals)
    #   - message.channels     (messages in public channels)
    #   - message.groups       (messages in private channels)
    #   - message.im           (DMs with the bot)
    #   - message.mpim         (multi-party DMs)
  interactivity:
    is_enabled: true
    # No Request URL needed with Socket Mode
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: true
